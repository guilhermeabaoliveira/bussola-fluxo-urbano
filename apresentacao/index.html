:root{color-scheme:dark;--bg:#15191f;--fg:#f5f3eb;--muted:#b9bec5;--gold:#d9b775}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--fg);font-family:Arial,sans-serif}button,a{touch-action:manipulation}button{font:inherit;color:var(--fg);background:#252b33;border:1px solid #49505b;border-radius:7px;padding:10px 15px;cursor:pointer}button:hover,a:hover{color:var(--gold)}button:focus-visible,a:focus-visible{outline:3px solid var(--gold);outline-offset:3px}button:disabled{opacity:.35;cursor:default}a{color:var(--fg);text-underline-offset:4px}header{display:flex;align-items:center;justify-content:space-between;gap:18px;padding:18px 28px;border-bottom:1px solid #353b45}header strong{letter-spacing:.04em;font-size:14px}nav{display:flex;gap:20px;align-items:center;font-size:14px}.stage{max-width:1440px;margin:auto;padding:12px 24px 0}.slide{margin:0;display:flex;justify-content:center}.slide img{display:block;max-width:100%;width:auto;height:auto;max-height:calc(100dvh - 185px);aspect-ratio:16/9;object-fit:contain}.controls{max-width:1200px;margin:12px auto;display:flex;align-items:center;gap:12px}.controls .counter{min-width:75px;text-align:center;font-variant-numeric:tabular-nums;color:var(--gold)}.controls .spacer{flex:1}#title{font-size:17px;font-weight:400;flex:1;margin:0}progress{width:100%;height:3px;accent-color:var(--gold);display:block;border:0}details{max-width:1100px;margin:20px auto 28px;color:var(--muted);line-height:1.65;padding:0 24px}summary{cursor:pointer;color:var(--fg)}#explanation{max-width:90ch}dialog{background:var(--bg);color:var(--fg);border:1px solid #49505b;border-radius:12px;max-width:1120px;width:90vw;max-height:88dvh;padding:24px}dialog::backdrop{background:#000b}.dialoghead{display:flex;align-items:center;justify-content:space-between}.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:16px;padding-top:20px}.thumb{text-align:left;padding:8px;font-size:14px;line-height:1.4}.thumb img{width:100%;height:auto;display:block;margin-bottom:8px}.thumb[aria-current=true]{border-color:var(--gold);color:var(--gold)}body:fullscreen header,body:fullscreen details{display:none}body:fullscreen .slide img{max-height:calc(100dvh - 90px)}body:fullscreen .stage{max-width:none}.hint{font-size:12px;color:var(--muted);text-align:center;margin:8px 0 18px}@media(max-width:760px){header{padding:14px 16px;align-items:flex-start;flex-direction:column;gap:12px}nav{gap:14px;flex-wrap:wrap;font-size:13px}.stage{padding:14px 0 0}.controls{padding:0 12px;flex-wrap:wrap;gap:8px}#title{flex-basis:100%;font-size:16px;order:-1}.controls .spacer{display:none}.controls button{padding:10px 12px}.controls .counter{flex:1}.slide img{max-height:none;width:100%}.grid{grid-template-columns:repeat(2,1fr);gap:10px}dialog{padding:16px;width:96vw}.hint{padding:0 12px}}@media(prefers-reduced-motion:reduce){*{scroll-behavior:auto!important}}

<script>
const slides=[{"number":1,"title":"Bússola de\nFluxo Urbano","summary":"Maquete do protótipo funcional. Grupo 12, Projetos I, CESAR School.","explanation":"","groups":["base","totem"]},{"number":2,"title":"A proposta física","summary":"Três rotas, leituras por ultrassom e uma indicação mecânica de maior fluxo.","explanation":"A maquete demonstra o princípio de comparar passagens detectadas por rota. A aplicação urbana requer dimensionamento, instalação e avaliação próprios. Maior fluxo não equivale a garantia de segurança.","groups":["sensor_A","sensor_B","sensor_C","totem"]},{"number":3,"title":"Dimensões da bancada","summary":"Base 600 × 400 mm em MDF de 3 mm. O desenho usa escala geométrica 1:1 da bancada.","explanation":"Dimensões da proposta: base 600 × 400 × 3 mm. Reforços 2 × 594 × 25 × 3 mm e 2 × 344 × 25 × 3 mm. Quatro pés de referência com diâmetro 20 mm e altura 25 mm. Medir a chapa e verificar o plano de corte antes de fabricar.","groups":["base"]},{"number":4,"title":"Uma célula de leitura por rota","summary":"O sensor mede a distância até um alvo ou até o anteparo de referência.","explanation":"Cada sensor fica na lateral, com centro de leitura a 60 mm da base. Referências: módulo HC-SR04 aproximado de 45 × 20 × 15 mm, suporte de 3 × 60 × 85 mm e pé de 35 × 60 × 3 mm. Anteparo de 100 × 80 × 3 mm. Os transdutores não atuam como sensor de piso.","groups":["sensor_A","sensor_B","sensor_C","anteparo_A","anteparo_B","anteparo_C"]},{"number":5,"title":"O que representa uma passagem","summary":"Um painel manual de MDF atravessa a faixa de leitura e representa uma passagem demonstrada.","explanation":"Alvo de MDF de 100 × 60 × 3 mm, com pega de referência 30 × 20 × 3 mm. O painel percorre Y = 70 a 275 mm. Após a passagem, o operador eleva o alvo 80 mm, retorna fora da faixa de leitura e baixa no início. O alvo não é um cartão eletrônico nem um humano em escala validada. A confiabilidade depende de eco suficiente e velocidade compatível.","groups":["alvo_A","alvo_B","alvo_C"]},{"number":6,"title":"Separação entre as rotas","summary":"Geometria e disparos sequenciais reduzem situações de leitura cruzada, mas não garantem isolamento acústico.","explanation":"O anteparo fornece fundo de referência. Ele não é uma garantia de isolamento acústico. O firmware dispara um sensor de cada vez com intervalo mínimo de 61 ms entre disparos. O ensaio cruzado deve mover o alvo A enquanto B e C permanecem livres, repetindo para todas as rotas. Ajustar posição, orientação e anteparos conforme resultados.","groups":["sensor_A","sensor_B","sensor_C","anteparo_A","anteparo_B","anteparo_C"]},{"number":7,"title":"Arduino UNO e tratamento das leituras","summary":"A UNO transforma leituras estáveis em eventos e fecha uma janela comum de 10 s.","explanation":"O firmware exige duas amostras estáveis para mudar de zona. Uma passagem exige estado livre antes de presença. Permanência diante do sensor não deve gerar contagem repetida. Sem eco válido, o canal não é tratado como livre. Janela com canal inválido fica incompleta e não compara rotas. Inicialização aguarda as três rotas livres e prontas. Referência da placa: 68,6 × 53,4 mm.","groups":["arduino"]},{"number":8,"title":"Pinagem e distribuição dos sinais","summary":"Cada sensor tem dois pinos de sinal próprios. O servo usa D9.","explanation":"Fonte da pinagem: sketch-tinkercad.ino e conexoes-conferidas.md. Referência dos conectores UNO: https://docs.arduino.cc/resources/pinouts/A000066-full-pinout.pdf. Protoboard de referência modelada em 165 × 55 × 10 mm, com reserva de espaço de 200 × 80 mm. Medir o exemplar.","groups":["arduino","protoboard","cabos"]},{"number":9,"title":"18 ligações organizadas sob a base","summary":"Chicotes seguem percursos próprios e entram por aberturas da estrutura.","explanation":"A malha contém 12 ligações dos três sensores, duas da UNO aos barramentos, três do servo e uma do negativo da fonte ao GND comum. O USB é separado. Cores por função: vermelho para alimentação positiva, preto para GND, amarelo para TRIG, ciano para ECHO e laranja para sinal do servo. Comprimento real, terminais e alívio de tração exigem conferência física. Referência de compra: 3 m de cabo 4 vias, com margem para três trechos de até 0,70 m.","groups":["cabos"]},{"number":10,"title":"Alimentação com referência comum","summary":"USB alimenta a UNO. A fonte regulada do servo mantém o positivo separado e compartilha GND.","explanation":"A proposta física separa a alimentação de potência do servo do 5 V da UNO. O negativo da fonte externa se une ao GND comum. Não unir o positivo externo ao barramento de 5 V da UNO. Conferir tensão, polaridade, capacidade e conectores da fonte real. O envelope da fonte no modelo não é uma medida certificada. Fonte de 5 A é capacidade nominal, não consumo do sistema.","groups":["fonte","arduino","protoboard"]},{"number":11,"title":"Totem e rosa dos ventos","summary":"O totem vertical mantém a identidade da proposta e apresenta a indicação mecânica.","explanation":"Totem de referência: caixa de 60 × 35 × 135 mm, altura total 165 mm. Mostrador vertical de diâmetro 90 mm, centro a 120 mm da base. A face e a rosa ficam fixas. Apenas o ponteiro gira. Ângulos são comandos do servo e não azimutes geográficos.","groups":["totem","ponteiro"]},{"number":12,"title":"Servo, horn e ponteiro","summary":"O horn original transmite o giro do servo ao ponteiro leve.","explanation":"O servo SG90 tem carcaça de referência orientada em 23 × 29 × 12,2 mm no modelo. Ponteiro com raio útil 37 mm, largura máxima 8 mm e massa alvo inferior a 2 g. Folga axial inicial proposta de 2 mm. A abertura na face e o suporte ajustável devem permitir engate integral do horn e acesso ao parafuso original. Não presumir que o eixo atravesse MDF nem inventar rosca universal.","groups":["servo","ponteiro"]},{"number":13,"title":"Acabamento e manutenção","summary":"Tampas removíveis escondem a faixa técnica durante a apresentação e permitem acesso à montagem.","explanation":"Compartimentos de referência: UNO 92 × 65 mm com parede de 25 mm. Protoboard 176 × 66 mm com parede de 25 mm. Fonte 102 × 70 mm com parede de 40 mm. Tampas e paredes de MDF de 3 mm. Não representam vedação certificada. As tampas da imagem estão afastadas apenas para explicar o acesso.","groups":["carenagem_uno","carenagem_protoboard","carenagem_fonte"]},{"number":14,"title":"Janela de demonstração de 10 s","summary":"A comparação acontece no fechamento da janela comum. O exemplo A=1, B=3 e C=2 indica B.","explanation":"Política do código: maior contagem válida vence. Empate mantém a rota anterior somente se ela também estiver entre os maiores valores. Empate sem anterior elegível, ausência de eventos ou janela incompleta levam ao neutro. O modelo didático model.mjs representa eventos já estáveis, não acústica ou todo o tratamento de falhas.","groups":["arduino","servo","ponteiro"]},{"number":15,"title":"Materiais e custos adicionais","summary":"Os subtotais são referências condicionais de 18/10/2026. Ainda não formam um orçamento fechado.","explanation":"Catálogo e orçamento de 18/10/2026: 2 HC-SR04 a R$ 9,40 = R$ 18,80; 2 chapas MDF a R$ 7,99 = R$ 15,98; pacote de jumpers R$ 11,90; 3 m de cabo 4 vias a R$ 4,50 = R$ 13,50. Subtotal mínimo condicionado R$ 60,18. Recomendado acrescenta fonte R$ 49,90, borne P4 R$ 3,90 e fita R$ 20,00, totalizando R$ 133,98. O mínimo pressupõe fonte, conexão e fixação emprestadas, sem confirmação. Não inclui frete, corte, terminais/crimpagem, fios do servo, cola, parafusos, pés e chapas extras.","groups":["base","sensor_A","sensor_B","sensor_C","cabos","fonte"]},{"number":16,"title":"Sequência de montagem","summary":"O trabalho começa pela célula de leitura e avança até o fechamento da maquete.","explanation":"Sequência proposta de execução, sem atribuir responsáveis não acordados. Primeiro conferir medidas e conexões com componentes reais. Testar uma célula e ajustar leitura. Repetir nas demais e executar teste cruzado. Conferir alimentação e servo antes da fixação definitiva. Só depois cortar e fechar a estrutura final. Planejar corpos de prova e preservar acesso aos terminais. Ajustar a fixação do anteparo: o modelo atual tem vão de 17 mm entre placa e pé.","groups":["base","sensor_A","sensor_B","sensor_C","arduino","protoboard","cabos","fonte","totem"]},{"number":17,"title":"Ensaios que sustentam a demonstração","summary":"Os resultados físicos precisam corresponder às passagens executadas e às regras do código.","explanation":"Registrar contagem esperada, contagem observada e condição de ensaio. Testar vazio, uma passagem, permanência do alvo, retorno elevado, apenas uma rota ativa, mudanças simultâneas, empates, ausência de eco e janela incompleta. Conferir aquecimento, reinicializações, estabilidade da alimentação, curso livre do ponteiro e folga mecânica. Os testes digitais já disponíveis não substituem estes ensaios.","groups":[]},{"number":18,"title":"Exploração técnica no Atlas 3D","summary":"O Atlas reúne 20 grupos selecionáveis com função, dimensões, materiais e montagem.","explanation":"Cobertura dos 20 grupos: base; totem; sensor_A, sensor_B, sensor_C; alvo_A, alvo_B, alvo_C; anteparo_A, anteparo_B, anteparo_C; arduino; protoboard; cabos; fonte; ponteiro; servo; carenagem_uno; carenagem_protoboard; carenagem_fonte. Todos os grupos são abordados nesta apresentação. O Atlas complementa a apresentação com rotação, zoom, isolamento, camadas e acompanhamento de cada circuito.","groups":[]}];let current=0;const $=id=>document.getElementById(id);const toPath=n=>'slides/slide-'+String(n+1).padStart(2,'0')+'.png';
function show(n){current=Math.max(0,Math.min(slides.length-1,n));const s=slides[current];$('slide').src=toPath(current);$('slide').alt=s.title.replace(/\n/g,' ')+'. '+s.summary;$('title').textContent=s.title.replace(/\n/g,' ');$('counter').textContent=(current+1)+' / '+slides.length;$('progress').value=current+1;$('previous').disabled=current===0;$('next').disabled=current===slides.length-1;$('description').textContent=s.summary;$('explanation').textContent=s.explanation||'';document.querySelectorAll('.thumb').forEach((el,i)=>el.setAttribute('aria-current',i===current?'true':'false'));history.replaceState(null,'','#slide-'+(current+1));}
function fullscreen(){if(document.fullscreenElement)document.exitFullscreen();else document.body.requestFullscreen().catch(()=>{$('fullscreen').textContent='Use F11 no navegador';});}
slides.forEach((s,i)=>{const b=document.createElement('button');b.className='thumb';b.setAttribute('aria-label','Slide '+(i+1)+': '+s.title.replace(/\n/g,' '));const im=document.createElement('img');im.src=toPath(i);im.alt='';im.loading='lazy';b.append(im,document.createTextNode(String(i+1).padStart(2,'0')+'  '+s.title.replace(/\n/g,' ')));b.onclick=()=>{show(i);$('dialog').close();$('index').focus()};$('grid').append(b)});
$('previous').onclick=()=>show(current-1);$('next').onclick=()=>show(current+1);$('index').onclick=()=>$('dialog').showModal();$('close').onclick=()=>$('dialog').close();$('fullscreen').onclick=fullscreen;
document.addEventListener('keydown',e=>{if($('dialog').open||['INPUT','TEXTAREA','SELECT'].includes(document.activeElement.tagName))return;if(['ArrowRight','PageDown',' '].includes(e.key)){e.preventDefault();show(current+1)}else if(['ArrowLeft','PageUp'].includes(e.key)){e.preventDefault();show(current-1)}else if(e.key==='Home'){e.preventDefault();show(0)}else if(e.key==='End'){e.preventDefault();show(slides.length-1)}else if(e.key.toLowerCase()==='f'){e.preventDefault();fullscreen()}});show(Number(location.hash.replace('#slide-',''))-1||0);
</script></body></html>
